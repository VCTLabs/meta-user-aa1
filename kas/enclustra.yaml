header:
    version: 9

# default refdes aa1 st1 machine name
#machine: refdes-me-aa1-270-2i2-d11e-nfx3-st1

# user layer aa1 st1 machine name from enclustra-module layer
machine: me-aa1-270-2i2-d11e-nfx3

env:
    # SoM ID and board rev are burned into enclustra EEPROM OTP device
    # set these machine vars here or in a machine conf file
    # change these if/when the actual HW module changes
    SOM_FAMILY_ID: "032D"
    MACHINE_REV: "02"
    UBOOT_CONFIG: sdmmc
    #UBOOT_CONFIG: emmc
    #UBOOT_CONFIG: qspi
    PACKAGE_FEED_IP_PORT: "192.168.7.150:8000"
    PACKAGE_FEED_TYPE: ipk

local_conf_header:
    dev: |
        DISTRO_FEATURES:remove = "wifi bluetooth pcmcia 3g nfc"
        IMAGE_FSTYPES:append = " wic.xz cpio.gz"
        PACKAGE_CLASSES ?= "package_${PACKAGE_FEED_TYPE}"
        PACKAGE_FEED_URIS = "http://${PACKAGE_FEED_IP_PORT}"
        INHERIT += "image-buildinfo"
        DEVICE_MODEL="${UBOOT_CONFIG}"
        DEVICE_TYPE="${MACHINE}-${DEVICE_MODEL}-${MACHINE_REV}"
        IMAGE_BUILDINFO_VARS = "DISTRO_NAME DISTRO_VERSION MACHINE SOM_FAMILY_ID MACHINE_REV"
        IMAGE_BUILDINFO_VARS:append = " DEVICE_MODEL DEVICE_TYPE IMAGE_BASENAME TUNE_PKGARCH"
        IMAGE_BUILDINFO_VARS:append = " TUNE_FEATURES MACHINE_FEATURES DISTRO_FEATURES"
        IMAGE_BUILDINFO_VARS:append = " IMAGE_FEATURES DISABLE_ROOT ROOT_HOME DATETIME"
