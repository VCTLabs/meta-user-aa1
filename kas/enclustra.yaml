header:
    version: 9

# default refdes aa1 st1 machine name
#machine: refdes-me-aa1-270-2i2-d11e-nfx3-st1

# user layer aa1 st1 machine name from enclustra-module layer
machine: me-aa1-270-2i2-d11e-nfx3

env:
    PACKAGE_FEED_IP_PORT: "192.168.7.150:8000"
    PACKAGE_FEED_TYPE: ipk
    UBOOT_CONFIG: sdmmc
    #UBOOT_CONFIG: emmc
    #UBOOT_CONFIG: qspi

local_conf_header:
    dev: |
        IMAGE_FSTYPES:append = " wic.xz cpio.gz"
        PACKAGE_CLASSES ?= "package_${PACKAGE_FEED_TYPE}"
        PACKAGE_FEED_URIS = "http://${PACKAGE_FEED_IP_PORT}"
        INHERIT += "image-buildinfo"
        DEVICE_MODEL="${UBOOT_CONFIG}"
        DEVICE_TYPE="${MACHINE}-${DEVICE_MODEL}"
        IMAGE_BUILDINFO_VARS = "DISTRO_NAME DISTRO_VERSION MACHINE DEVICE_MODEL DEVICE_TYPE"
        IMAGE_BUILDINFO_VARS:append = " DATETIME IMAGE_BASENAME TUNE_PKGARCH TUNE_FEATURES"
        IMAGE_BUILDINFO_VARS:append = " MACHINE_FEATURES DISTRO_FEATURES IMAGE_FEATURES"
        IMAGE_BUILDINFO_VARS:append = " DISABLE_ROOT ROOT_HOME"
