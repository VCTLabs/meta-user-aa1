header:
    version: 9

local_conf_header:
    fit: |
        KERNEL_CLASSES += "kernel-fitimage"
        KERNEL_IMAGETYPES += " fitImage "
        EXTERNAL_KERNEL_DEVICETREE = "${DEPLOY_DIR_IMAGE}/devicetree"
        FIT_CONF_DEFAULT_DTB = "enclustra-user.dtb"
        UBOOT_DTB_LOADADDRESS = "0x10000000"
        UBOOT_DTBO_LOADADDRESS = "0x100c0000"
        UBOOT_RD_LOADADDRESS = "0x12000000"
        #UBOOT_RD_ENTRYPOINT = "0x12000000"
        #UBOOT_ENV_BINARY = ""
        IMAGE_BOOT_FILES:append = " fitImage;image.ub"

        INITRAMFS_IMAGE = "devel-initramfs"
        #IMAGE_BOOT_FILES:append = " fitImage-devel-initramfs;devel-initramfs.ub"
