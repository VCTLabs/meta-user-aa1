header:
    version: 9

local_conf_header:
    fit: |
        KERNEL_CLASSES += "kernel-fitimage"
        KERNEL_IMAGETYPES += " fitImage "
        EXTERNAL_KERNEL_DEVICETREE = "${DEPLOY_DIR_IMAGE}/devicetree"
        FIT_CONF_DEFAULT_DTB = "enclustra-user.dtb"
        IMAGE_BOOT_FILES:append = " fitImage;image.ub"
