globals :
{
    verbose         = true;
    loglevel        = 5;
    syslog          = true;
    public-key-file = "@@PUBKEY@@";
    aes-key-file = "@@AESKEY@@";
};


logcolors : {
    error = "red:bold";
    trace = "green:normal";
    debug = "magenta:normal";
    warning = "yellow:underline";
};

download : {
    retries         = 3;
    timeout         = 1800;
};

identify : (
	{ name = "image"; value = "@@IMAGE@@"; },
	{ name = "device"; value = "@@DEVICE@@"; },
	{ name = "version"; value = "@@CURRENT_VERSION@@"; },
);
